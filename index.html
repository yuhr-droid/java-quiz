let mode='category', currentCat=0, pos=0, totalScore=0, answered=false;
const catState=CATS.map(()=>({pos:0,score:0,done:false}));
const menu=document.getElementById('menu'),quiz=document.getElementById('quiz'),result=document.getElementById('result');
const catGrid=document.getElementById('catGrid');
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function catQuestions(ci){return Q.filter(x=>x.category===CATS[ci].name)}
function renderMenu(){
  catGrid.innerHTML='';
  CATS.forEach((c,i)=>{const s=catState[i], qs=catQuestions(i); const b=document.createElement('button'); b.className='cat'+(i===currentCat&&quiz.classList.contains('hidden')===false?' current':'');
    b.innerHTML=`<div class="catno">${String(i+1).padStart(2,'0')} / ${CATS.length}</div><div class="catname">${c.name}</div><div class="catdesc">${c.desc}</div><div class="catmeta">${c.count}問　${s.done?'完了':'進捗 '+s.pos+'/'+c.count}</div>`; b.onclick=()=>startCategory(i); catGrid.appendChild(b);});
}
function startCategory(ci){currentCat=ci; mode='category'; if(catState[ci].done){catState[ci].pos=0;catState[ci].score=0;catState[ci].done=false;} pos=catState[ci].pos; menu.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden'); render();}
function startAll(){mode='all'; pos=0; currentCat=0; menu.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden'); render();}
function currentQuestion(){if(mode==='all') return Q[pos]; return catQuestions(currentCat)[pos]}
function overallIndex(q){return Q.indexOf(q)}
function render(){
 const q=currentQuestion(); if(!q) return finish(); const qs=catQuestions(currentCat); const oi=overallIndex(q);
 document.getElementById('overallLabel').textContent=`全体 ${oi+1} / ${Q.length}`;
 document.getElementById('overallFill').style.width=((oi+1)/Q.length*100)+'%';
 document.getElementById('sectionK').textContent=`第${currentCat+1}項目 / ${CATS.length}項目`;
 document.getElementById('sectionTitle').textContent=`${String(currentCat+1).padStart(2,'0')}｜${q.category}`;
 document.getElementById('sectionMeta').textContent=`この項目：${qs.length}問　｜　項目内 ${pos+1} / ${qs.length}`;
 document.getElementById('qNo').textContent=`項目内 第${pos+1}問　｜　全体 第${oi+1}問`;
 document.getElementById('qType').textContent=q.type;
 document.getElementById('difficulty').textContent=stars(q.difficulty);
 document.getElementById('fileName').textContent=q.file;

 const code=document.getElementById('code'); code.innerHTML='';
 const source=FULL_SOURCE[q.file];
 const targetLine=SOURCE_TARGET_LINES[String(q.id)];
 if(source){
   for(let ln=1; ln<source.length; ln++){
     const d=document.createElement('div');
     const isTarget=(ln===Number(targetLine));
     d.className='line source-context'+(isTarget?' target':'');
     const n=document.createElement('span'); n.className='ln'; n.textContent=String(ln);
     const t=document.createElement('span'); t.className='ct'; t.textContent=source[ln] || '';
     d.appendChild(n); d.appendChild(t); code.appendChild(d);
   }
   const note=document.createElement('div'); note.className='code-note';
   note.innerHTML='<strong>▶ 色が付いている行</strong>が今回の出題箇所です。前後を含めてファイル全体をスクロールして確認できます。';
   code.appendChild(note);
   requestAnimationFrame(()=>{
     const active=code.querySelector('.line.target');
     if(active) active.scrollIntoView({block:'center',behavior:'auto'});
     else code.scrollTop=0;
   });
 }else{
   // 項目④以降は、元の問題データに収録されている同じ項目のコード例をまとめて
   // 「この項目で使うコード全体」として表示します。現在の問題のコードは強調表示します。
   const sameCat=Q.filter(x=>x.category===q.category);
   let lineNo=0;
   sameCat.forEach((item,qi)=>{
     const head=document.createElement('div');
     head.className='source-label';
     head.textContent=`【問題${qi+1}】`;
     code.appendChild(head);
     item.code.split('\n').forEach(line=>{
       lineNo++;
       const d=document.createElement('div');
       const isCurrent=item.id===q.id;
       d.className='line source-context'+(isCurrent?' target':'');
       const n=document.createElement('span');n.className='ln';n.textContent=String(lineNo);
       const t=document.createElement('span');t.className='ct';t.textContent=line;
       d.appendChild(n);d.appendChild(t);code.appendChild(d);
     });
     const sep=document.createElement('div');sep.className='source-sep';sep.textContent='';code.appendChild(sep);
   });
   const note=document.createElement('div'); note.className='code-note';
   note.innerHTML='<strong>▶ 色が付いているコード</strong>が今回の出題箇所です。同じ項目で使うコード例を上から下までスクロールして確認できます。';
   code.appendChild(note);
   requestAnimationFrame(()=>{
     const active=code.querySelector('.line.target');
     if(active) active.scrollIntoView({block:'center',behavior:'auto'});
     else code.scrollTop=0;
   });
 }

 document.getElementById('qtext').textContent=q.q;
 const opts=document.getElementById('options'); opts.innerHTML=''; q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'　'+o;b.onclick=()=>answer(i);opts.appendChild(b)});
 document.getElementById('feedback').className='feedback'; document.getElementById('verdict').textContent=''; document.getElementById('explain').textContent='';
 const nb=document.getElementById('nextBtn'); nb.classList.add('hidden'); nb.textContent='次の問題 →'; answered=false;
}
function answer(i){if(answered)return; answered=true; const q=currentQuestion(); const ok=i===q.correct; const state=catState[currentCat]; if(ok){state.score++; totalScore++} document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('good');if(k===i&&k!==q.correct)b.classList.add('bad');if(k!==q.correct&&k!==i)b.classList.add('dim')}); const fb=document.getElementById('feedback'); fb.className='feedback show'; document.getElementById('verdict').className='verdict '+(ok?'goodtext':'badtext');document.getElementById('verdict').textContent=ok?'✓ 正解':'× 不正解';document.getElementById('explain').textContent=q.ex; document.getElementById('nextBtn').classList.remove('hidden');}
function next(){if(mode==='all'){pos++; if(pos>=Q.length)return finish(); currentCat=CATS.findIndex(c=>c.name===Q[pos].category); render();}else{pos++;catState[currentCat].pos=pos;if(pos>=catQuestions(currentCat).length){catState[currentCat].done=true;catState[currentCat].pos=catQuestions(currentCat).length;renderMenu();return finishCategory()}render()}}
function finishCategory(){quiz.classList.add('hidden'); menu.classList.remove('hidden'); renderMenu(); alert(`${CATS[currentCat].name} を完了しました！\n${catState[currentCat].score} / ${catQuestions(currentCat).length} 正解`);}
function finish(){quiz.classList.add('hidden');menu.classList.add('hidden');result.classList.remove('hidden'); const total=catState.reduce((a,s)=>a+s.score,0); document.getElementById('score').textContent=`${total} / ${Q.length}`; const bd=document.getElementById('breakdown');bd.innerHTML='';CATS.forEach((c,i)=>{const s=catState[i];const d=document.createElement('div');d.className='row';d.innerHTML=`<span>${String(i+1).padStart(2,'0')}｜${c.name}</span><strong>${s.done?s.score+' / '+c.count:'未挑戦'}</strong>`;bd.appendChild(d)});}
