let currentSet=[...questions],index=0,score=0,answered=false,history=[];
const categories=["すべて",...new Set(questions.map(x=>x.cat))];
const cats=document.getElementById("categories");
categories.forEach((cat,i)=>{const b=document.createElement("button");b.className="cat"+(i===0?" active":"");b.textContent=cat;b.onclick=()=>selectCategory(cat,b);cats.appendChild(b)});
function selectCategory(cat,btn){document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));btn.classList.add("active");currentSet=cat==="すべて"? [...questions]:questions.filter(x=>x.cat===cat);restart()}
function restart(){index=0;score=0;answered=false;history=[];document.getElementById("quiz").style.display="block";document.getElementById("result").style.display="none";showQuestion()}
function showQuestion(){const x=currentSet[index];answered=false;document.getElementById("progressText").textContent=`第${index+1}問 / ${currentSet.length}問`;document.getElementById("scoreText").textContent=`正解 ${score}問`;document.getElementById("progressBar").style.width=((index)/currentSet.length*100)+"%";document.getElementById("categoryTitle").textContent="【"+x.cat+"】";document.getElementById("question").textContent=x.q;const box=document.getElementById("options");box.innerHTML="";x.a.forEach((ans,i)=>{const b=document.createElement("button");b.className="option";b.textContent=`${String.fromCharCode(65+i)}. ${ans}`;b.onclick=()=>answer(i,b);box.appendChild(b)});const f=document.getElementById("feedback");f.className="feedback";f.textContent="";document.getElementById("next").style.display="none"}
function answer(i,button){if(answered)return;answered=true;const x=currentSet[index];document.querySelectorAll(".option").forEach(b=>b.disabled=true);if(i===x.c){score++;button.classList.add("correct");feedback("⭕ 正解！",x.e,true)}else{button.classList.add("wrong");document.querySelectorAll(".option")[x.c].classList.add("correct");feedback("❌ 不正解",`正解は「${x.a[x.c]}」です。${x.e}`,false)}history.push({q:x.q,correct:i===x.c,right:x.a[x.c]});document.getElementById("scoreText").textContent=`正解 ${score}問`;document.getElementById("progressBar").style.width=((index+1)/currentSet.length*100)+"%";document.getElementById("next").style.display="block"}
function feedback(title,msg,ok){const f=document.getElementById("feedback");f.className="feedback show "+(ok?"ok":"ng");f.innerHTML="";const strong=document.createElement("strong");strong.textContent=title;f.appendChild(strong);f.appendChild(document.createElement("br"));const span=document.createElement("span");span.textContent=msg;f.appendChild(span)}
document.getElementById("next").onclick=()=>{index++;if(index<currentSet.length)showQuestion();else showResult()}
function showResult(){document.getElementById("quiz").style.display="none";document.getElementById("result").style.display="block";document.getElementById("finalScore").textContent=`${score} / ${currentSet.length}`;const rate=score/currentSet.length;document.getElementById("resultMessage").textContent=rate===1?"🌟 全問正解！":rate>=.8?"✨ かなり正解できています！":rate>=.6?"👍 いい感じ！間違えた問題を復習しましょう。":"📖 もう一度挑戦して、用語を覚えていきましょう！";document.getElementById("review").innerHTML="<h3>📝 結果</h3>"+history.map((h,i)=>`<div class="review-item">${h.correct?"⭕":"❌"} 第${i+1}問：${escapeHTML(h.q)}<br><small>正解：${escapeHTML(h.right)}</small></div>`).join("")}
function escapeHTML(text){return String(text).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
restart();
</script>
