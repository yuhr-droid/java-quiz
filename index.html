let idx = 0;
let score = 0;
let answered = false;

const progressLabel = document.getElementById('progressLabel');
const progressFill = document.getElementById('progressFill');
const fileName = document.getElementById('fileName');
const codeLines = document.getElementById('codeLines');
const qtext = document.getElementById('qtext');
const optionsEl = document.getElementById('options');
const feedback = document.getElementById('feedback');
const verdict = document.getElementById('verdict');
const explain = document.getElementById('explain');
const nextBtn = document.getElementById('nextBtn');
const quizStage = document.getElementById('quizStage');
const resultEl = document.getElementById('result');
const scoreNum = document.getElementById('scoreNum');
const restartBtn = document.getElementById('restartBtn');

function shuffleOptions(item){
  const opts = item.opts.map((text,i)=>({text, isCorrect:i===item.correct}));
  for(let i=opts.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [opts[i],opts[j]]=[opts[j],opts[i]];
  }
  return opts;
}

function render(){
  answered = false;
  const item = Q[idx];
  progressLabel.textContent = (idx+1) + ' / ' + Q.length;
  progressFill.style.width = ((idx)/Q.length*100) + '%';
  fileName.textContent = item.file;

  codeLines.innerHTML = '';
  const n = item.line;
  for(let ln = n-2; ln <= n+2; ln++){
    if(ln < 1) continue;
    const row = document.createElement('div');
    row.className = 'code-line' + (ln===n ? ' active' : ' context');
    const g = document.createElement('span');
    g.className = 'gutter';
    g.textContent = ln;
    const t = document.createElement('span');
    t.className = 'code-text';
    t.textContent = (ln===n) ? item.code : '···';
    row.appendChild(g);
    row.appendChild(t);
    codeLines.appendChild(row);
  }

  qtext.textContent = item.q;
  optionsEl.innerHTML = '';
  feedback.className = 'feedback';
  feedback.classList.remove('show');
  nextBtn.classList.remove('show');

  const shuffled = shuffleOptions(item);
  shuffled.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt.text;
    btn.addEventListener('click', ()=> selectAnswer(btn, opt, shuffled));
    optionsEl.appendChild(btn);
  });
}

function selectAnswer(btn, opt, shuffled){
  if(answered) return;
  answered = true;
  const item = Q[idx];

  Array.from(optionsEl.children).forEach((b, i)=>{
    b.disabled = true;
    const matchedOpt = shuffled[i];
    if(matchedOpt.isCorrect){
      b.classList.add('correct');
    } else if(b === btn){
      b.classList.add('wrong');
    } else {
      b.classList.add('dim');
    }
  });

  if(opt.isCorrect){
    score++;
    verdict.textContent = '正解！';
    feedback.classList.add('correct-fb');
    feedback.classList.remove('wrong-fb');
  } else {
    verdict.textContent = '不正解';
    feedback.classList.add('wrong-fb');
    feedback.classList.remove('correct-fb');
  }
  explain.textContent = item.ex;
  feedback.classList.add('show');
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', ()=>{
  idx++;
  if(idx >= Q.length){
    quizStage.classList.add('hidden');
    resultEl.classList.add('show');
    scoreNum.textContent = score + ' / ' + Q.length;
  } else {
    render();
  }
});

restartBtn.addEventListener('click', ()=>{
  idx = 0; score = 0;
  resultEl.classList.remove('show');
  quizStage.classList.remove('hidden');
  render();
});

render();
</script>
